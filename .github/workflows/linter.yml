# ==========================================================
# SUPER-LINTER GITHUB ACTIONS WORKFLOW
# Automatically checks the repository for code-quality issues.
# ==========================================================

name: Lint Code Base

# Run the workflow whenever code is pushed or a pull request
# is created or updated.
on:
  push:
  pull_request:

# Give the workflow read-only access to repository contents,
# and write access to report statuses back to the API.
permissions:
  contents: read
  statuses: write

jobs:
  build:
    # Name displayed in the GitHub Actions interface.
    name: Lint Code Base

    # Run the checks on an Ubuntu environment.
    runs-on: ubuntu-latest

    steps:

      # 1. Download the repository files.
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Download the complete Git history.
          fetch-depth: 0

      # 2. Run Super-Linter.
      - name: Lint Code Base
        uses: super-linter/super-linter@v7

        env:

          # Check every file in the repository.
          VALIDATE_ALL_CODEBASE: true

          # Automatically identify the repository's default branch.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

          # GitHub authentication token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --------------------------------------------------
          # ENABLE ALL SEVEN CHECKS FROM YOUR ORIGINAL LOG
          # --------------------------------------------------

          # 1. Check Bash scripts for syntax and code problems.
          VALIDATE_BASH: true

          # 2. Check executable Bash scripts.
          VALIDATE_BASH_EXEC: true

          # 3. Check infrastructure files for security issues.
          VALIDATE_CHECKOV: true

          # 4. Detect accidentally committed secrets.
          VALIDATE_GITLEAKS: true

          # 5. Detect unresolved Git merge conflict markers.
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true

          # 6. Detect duplicated code.
          VALIDATE_JSCPD: true

          # 7. Check shell script formatting with shfmt.
          VALIDATE_SHELL_SHFMT: true
